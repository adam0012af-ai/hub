name: Install MovieHub D1 Import Final
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace project
        run: |
          mkdir -p /tmp/moviehub
          unzip -q moviehub_final_d1_import.zip -d /tmp/moviehub
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'moviehub_final_d1_import.zip' -exec rm -rf {} +
          cp -a /tmp/moviehub/. .
          rm -f moviehub_final_d1_import.zip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Install MovieHub D1 channels and URL importer"
          git push
