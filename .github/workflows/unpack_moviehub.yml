name: Install MovieHub Final Panel
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and replace project
        run: |
          mkdir -p /tmp/moviehub
          unzip -q moviehub_final_panel.zip -d /tmp/moviehub
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'moviehub_final_panel.zip' -exec rm -rf {} +
          cp -a /tmp/moviehub/. .
          rm -f moviehub_final_panel.zip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Install MovieHub final panel"
          git push
