name: Unpack MovieHub Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace project from package
        run: |
          mkdir -p /tmp/moviehub
          unzip -q moviehub_cloudflare_full.zip -d /tmp/moviehub
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'moviehub_cloudflare_full.zip' -exec rm -rf {} +
          cp -a /tmp/moviehub/. .
          rm -f moviehub_cloudflare_full.zip
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy MovieHub Cloudflare package"
          git push
